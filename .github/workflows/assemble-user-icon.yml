name: Assemble supplied icon

on:
  push:
    branches:
      - fix/use-user-supplied-icon

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact supplied icon
        shell: bash
        run: |
          cat assets/.icon-part-00.b64 assets/.icon-part-01.b64 assets/.icon-part-02.b64 assets/.icon-part-03.b64 > /tmp/unclaimable-icon.b64
          base64 --decode /tmp/unclaimable-icon.b64 > assets/unclaimable-icon.png
          test "$(stat -c %s assets/unclaimable-icon.png)" = "16116"
          echo "76641f9a541a2fc0ba12b310f20a5e7a9c81aa5b609fb218c1c86a8e0c205f80  assets/unclaimable-icon.png" | sha256sum --check --strict

      - name: Commit reconstructed icon
        shell: bash
        run: |
          rm assets/.icon-part-00.b64 assets/.icon-part-01.b64 assets/.icon-part-02.b64 assets/.icon-part-03.b64
          rm .github/workflows/assemble-user-icon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use supplied Unclaimable icon"
          git push origin HEAD:fix/use-user-supplied-icon

name: NuGet Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/release.yml"
      - "Directory.Build.props"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Directory.Build.props"
      - "LICENSE"
      - "README.md"
      - "README.NUGET.md"
      - "CHANGELOG.md"
      - "assets/**"
      - "data/**"
      - "conformance/**"
      - "platforms/dotnet/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-validate:
    name: Build and validate packages
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Read and validate release version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $versionNode = $props.SelectSingleNode("/Project/PropertyGroup/UnclaimableVersion")
          if ($null -eq $versionNode -or [string]::IsNullOrWhiteSpace($versionNode.InnerText)) {
              throw "UnclaimableVersion is missing from Directory.Build.props."
          }

          $version = $versionNode.InnerText.Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Package version: $version"

          if ($env:GITHUB_REF_TYPE -eq "tag") {
              $expectedTag = "v$version"
              if ($env:GITHUB_REF_NAME -ne $expectedTag) {
                  throw "Release tag '$env:GITHUB_REF_NAME' does not match package version '$version'. Expected '$expectedTag'."
              }

              git fetch origin main --quiet
              $mainSha = (git rev-parse origin/main).Trim()
              if ($env:GITHUB_SHA -ne $mainSha) {
                  throw "Release tag must point at the current main commit. Tag: $env:GITHUB_SHA; main: $mainSha"
              }
          }

      - name: Test
        run: dotnet test platforms/dotnet/tests/Unclaimable.Tests/Unclaimable.Tests.csproj --configuration Release

      - name: Pack core
        run: dotnet pack platforms/dotnet/src/Unclaimable/Unclaimable.csproj --configuration Release --output artifacts

      - name: Pack ASP.NET Core integration
        run: dotnet pack platforms/dotnet/src/Unclaimable.AspNetCore/Unclaimable.AspNetCore.csproj --configuration Release --output artifacts

      - name: Validate package contents and metadata
        shell: pwsh
        run: ./platforms/dotnet/scripts/Validate-Packages.ps1 -ArtifactsPath ./artifacts

      - name: Restore packaged consumer smoke test
        run: >-
          dotnet restore platforms/dotnet/smoke/Unclaimable.ConsumerSmoke/Unclaimable.ConsumerSmoke.csproj
          --configfile platforms/dotnet/smoke/Unclaimable.ConsumerSmoke/NuGet.config
          --packages artifacts/.smoke-packages
          --no-cache

      - name: Run packaged consumer smoke test
        run: dotnet run --project platforms/dotnet/smoke/Unclaimable.ConsumerSmoke/Unclaimable.ConsumerSmoke.csproj --configuration Release --no-restore

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: unclaimable-release-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to NuGet.org
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')))
    needs: build-and-validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          name: unclaimable-release-packages
          path: artifacts

      - name: Validate NuGet account configuration
        shell: bash
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::GitHub Actions secret NUGET_USER is not configured. Set it to your nuget.org profile username, not your email address."
            exit 1
          fi

      - name: NuGet login via Trusted Publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish core package
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ needs.build-and-validate.outputs.version }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          EXTRA_ARGS=""
          if [ "$RUN_ATTEMPT" -gt 1 ]; then
            EXTRA_ARGS="--skip-duplicate"
          fi

          dotnet nuget push "artifacts/Unclaimable.${VERSION}.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            $EXTRA_ARGS

      - name: Publish ASP.NET Core package
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ needs.build-and-validate.outputs.version }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          EXTRA_ARGS=""
          if [ "$RUN_ATTEMPT" -gt 1 ]; then
            EXTRA_ARGS="--skip-duplicate"
          fi

          dotnet nuget push "artifacts/Unclaimable.AspNetCore.${VERSION}.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            $EXTRA_ARGS

      - name: Tag and create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-and-validate.outputs.version }}
        run: |
          TAG="v${VERSION}"

          EXISTING_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            if [ "$EXISTING_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Tag ${TAG} already exists at ${EXISTING_SHA}, expected ${GITHUB_SHA}."
              exit 1
            fi
            echo "Tag ${TAG} already points at this release commit."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="${GITHUB_SHA}" >/dev/null
            echo "Created tag ${TAG}."
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release ${TAG} already exists."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Unclaimable ${VERSION}" \
              --generate-notes \
              --verify-tag
          fi

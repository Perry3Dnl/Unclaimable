name: .NET 0.7.6 Compatibility

on:
  push:
    paths:
      - "Directory.Build.props"
      - "data/**"
      - "conformance/**"
      - "platforms/dotnet/**"
      - ".github/workflows/compatibility.yml"
  pull_request:
    paths:
      - "Directory.Build.props"
      - "data/**"
      - "conformance/**"
      - "platforms/dotnet/**"
      - ".github/workflows/compatibility.yml"

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Run behavioral compatibility corpus
        run: dotnet test platforms/dotnet/tests/Unclaimable.Tests/Unclaimable.Tests.csproj --configuration Release

      # 0.7.1, 0.7.2, and 0.7.3 are staged but not published yet. Keep the package-validation
      # baseline on the latest package that actually exists on NuGet.org.
      - name: Validate core public API against latest published NuGet baseline (v0.7.0)
        run: dotnet pack platforms/dotnet/src/Unclaimable/Unclaimable.csproj --configuration Release --output artifacts/compat

      - name: Validate ASP.NET Core public API against latest published NuGet baseline (v0.7.0)
        run: dotnet pack platforms/dotnet/src/Unclaimable.AspNetCore/Unclaimable.AspNetCore.csproj --configuration Release --output artifacts/compat

      - name: Validate new email package can be packed
        run: dotnet pack platforms/dotnet/src/Unclaimable.Email/Unclaimable.Email.csproj --configuration Release --output artifacts/compat

      - name: Validate new extended package can be packed
        run: dotnet pack platforms/dotnet/src/Unclaimable.Extended/Unclaimable.Extended.csproj --configuration Release --output artifacts/compat

name: .NET

on:
  push:
    paths:
      - "Directory.Build.props"
      - "LICENSE"
      - "README.md"
      - "README.NUGET.md"
      - "CHANGELOG.md"
      - "assets/**"
      - "data/**"
      - "conformance/**"
      - "platforms/dotnet/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "Directory.Build.props"
      - "LICENSE"
      - "README.md"
      - "README.NUGET.md"
      - "CHANGELOG.md"
      - "assets/**"
      - "data/**"
      - "conformance/**"
      - "platforms/dotnet/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test-and-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 runtime
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup .NET 11 preview SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - name: Verify frozen 0.8.0 defaults
        run: >-
          dotnet test platforms/dotnet/tests/Unclaimable.Tests/Unclaimable.Tests.csproj
          --configuration Release
          --filter "FullyQualifiedName~Options080DefaultContractTests"

      - name: Dataset statistics
        shell: pwsh
        run: ./platforms/dotnet/scripts/Get-DatasetStatistics.ps1

      - name: Test with coverage
        run: >-
          dotnet test platforms/dotnet/tests/Unclaimable.Tests/Unclaimable.Tests.csproj
          --configuration Release
          --settings platforms/dotnet/coverage.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/coverage

      - name: Enforce production line coverage
        shell: pwsh
        run: ./platforms/dotnet/scripts/Test-Coverage.ps1 -ResultsPath ./artifacts/coverage -MinimumLineCoverage 98

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unclaimable-coverage
          path: artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 14

      - name: Verify source build without language packs
        run: |
          trimmed_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$trimmed_dir"
          rm -rf "$trimmed_dir/data/languages"
          dotnet build "$trimmed_dir/platforms/dotnet/src/Unclaimable/Unclaimable.csproj" --configuration Release
          dotnet build "$trimmed_dir/platforms/dotnet/src/Unclaimable.AspNetCore/Unclaimable.AspNetCore.csproj" --configuration Release
          dotnet build "$trimmed_dir/platforms/dotnet/src/Unclaimable.Email/Unclaimable.Email.csproj" --configuration Release
          dotnet build "$trimmed_dir/platforms/dotnet/src/Unclaimable.Extended/Unclaimable.Extended.csproj" --configuration Release

      - name: Pack core
        run: dotnet pack platforms/dotnet/src/Unclaimable/Unclaimable.csproj --configuration Release --output artifacts

      - name: Pack ASP.NET Core integration
        run: dotnet pack platforms/dotnet/src/Unclaimable.AspNetCore/Unclaimable.AspNetCore.csproj --configuration Release --output artifacts

      - name: Pack email integration
        run: dotnet pack platforms/dotnet/src/Unclaimable.Email/Unclaimable.Email.csproj --configuration Release --output artifacts

      - name: Pack extended datasets
        run: dotnet pack platforms/dotnet/src/Unclaimable.Extended/Unclaimable.Extended.csproj --configuration Release --output artifacts

      - name: Validate package contents and metadata
        shell: pwsh
        run: ./platforms/dotnet/scripts/Validate-Packages.ps1 -ArtifactsPath ./artifacts

      - name: Restore packaged consumer smoke test
        run: >-
          dotnet restore platforms/dotnet/smoke/Unclaimable.ConsumerSmoke/Unclaimable.ConsumerSmoke.csproj
          --configfile platforms/dotnet/smoke/Unclaimable.ConsumerSmoke/NuGet.config
          --packages artifacts/.smoke-packages
          --no-cache

      - name: Run packaged consumer smoke test
        run: dotnet run --project platforms/dotnet/smoke/Unclaimable.ConsumerSmoke/Unclaimable.ConsumerSmoke.csproj --configuration Release --no-restore

      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unclaimable-nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7

name: .NET Benchmarks

on:
  push:
    branches:
      - "release/0.7.2"
    paths:
      - "platforms/dotnet/src/**"
      - "platforms/dotnet/benchmarks/**"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Run benchmarks
        run: dotnet run --project platforms/dotnet/benchmarks/Unclaimable.Benchmarks/Unclaimable.Benchmarks.csproj --configuration Release

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unclaimable-benchmarks
          path: BenchmarkDotNet.Artifacts/results/*
          if-no-files-found: error
          retention-days: 14

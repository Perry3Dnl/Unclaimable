name: .NET Benchmarks

on:
  push:
    branches:
      - "release/0.6.0"
    paths:
      - "platforms/dotnet/src/**"
      - "platforms/dotnet/benchmarks/**"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Run benchmarks
        run: dotnet run --project platforms/dotnet/benchmarks/Unclaimable.Benchmarks/Unclaimable.Benchmarks.csproj --configuration Release

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unclaimable-benchmarks
          path: BenchmarkDotNet.Artifacts/results/*
          if-no-files-found: error
          retention-days: 14

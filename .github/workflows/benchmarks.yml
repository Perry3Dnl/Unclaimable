name: .NET Benchmarks

on:
  push:
    branches:
      - "release/0.7.2"
      - "feature/0.8.4-context-aware-email"
    paths:
      - "platforms/dotnet/src/**"
      - "platforms/dotnet/benchmarks/**"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Run benchmarks
        run: dotnet run --project platforms/dotnet/benchmarks/Unclaimable.Benchmarks/Unclaimable.Benchmarks.csproj --configuration Release

      - name: Measure partial matching at 0 to 10k entries
        run: dotnet run --project platforms/dotnet/benchmarks/Unclaimable.Benchmarks083/Unclaimable.Benchmarks083.csproj --configuration Release -- --filter "*PartialMatchingScale084Benchmarks*"

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unclaimable-benchmarks
          path: BenchmarkDotNet.Artifacts/results/*
          if-no-files-found: error
          retention-days: 14
